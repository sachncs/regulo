[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regulo"
version = "0.2.0"
description = "Pure Python reproduction of Adaptive Norm-Based Regularization for Neural Networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Sachin", email = "sachncs@gmail.com"},
]
keywords = [
    "neural-networks",
    "regularization",
    "adaptive-norm",
    "covridge",
    "sparridge",
    "machine-learning",
    "deep-learning",
    "numpy",
    "research-reproduction",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23,<3",
    "scipy>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=4.0,<8",
    "hypothesis>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/sachncs/regulo"
Repository = "https://github.com/sachncs/regulo"
Issues = "https://github.com/sachncs/regulo/issues"
Documentation = "https://sachncs.github.io/regulo/"
Changelog = "https://github.com/sachncs/regulo/blob/master/CHANGELOG.md"
Logo = "https://raw.githubusercontent.com/sachncs/regulo/master/assets/logo.svg"

[tool.setuptools.packages.find]
where = ["."]
include = ["regulo*"]

[tool.setuptools.package-data]
regulo = ["py.typed"]

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
line_length = 80
known_first_party = ["regulo"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "PLC"]
ignore = ["E501", "B905", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
