name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: build, verify, and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]" mypy ruff
          python -m build

      - name: Run release quality gates
        run: |
          ruff check regulo tests
          mypy regulo
          pytest tests/ --tb=short --cov=regulo --cov-fail-under=95 --doctest-modules

      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/regulo-wheel-check
          /tmp/regulo-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/regulo-wheel-check/bin/python - <<'PY'
          import tempfile
          import numpy as np
          import regulo

          model = regulo.MLP([2, 3, 1], seed=0)
          runner = regulo.Runner(model, regulo.Square(), regulo.Ridge(0.01), regulo.Adam(), epochs=2)
          x = np.zeros((4, 2))
          y = np.zeros((4, 1))
          runner.fit(x, y, seed=0)
          with tempfile.TemporaryDirectory() as directory:
              regulo.save(runner, directory + "/checkpoint")
              restored = regulo.load(directory + "/checkpoint")
              assert restored.predict(x).shape == (4, 1)
          print(regulo.__version__)
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
